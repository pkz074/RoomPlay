name: Go checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        run: go fmt ./...
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build services
        run: go build ./cmd/...

  broker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Real NATS broker integration and race tests
        run: go test -race -tags=broker ./tests/integration -run '^TestBroker' -count=1 -timeout=2m

  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROOMPLAY_PROCESS_RACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Separate-process crash and recovery tests
        env:
          ROOMPLAY_EVIDENCE_DIR: ${{ runner.temp }}/roomplay-process-evidence
        run: go test -race -tags=process ./cmd/demo ./tests/integration -run '^TestProcess' -count=1 -timeout=5m
      - name: Save process logs and state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-failure-evidence
          path: |
            ${{ runner.temp }}/roomplay-process-evidence
            .demo-logs/
          include-hidden-files: true
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Frontend unit and API contract tests
        run: node --test web/app.test.js tests/integration/frontend_http.test.js
